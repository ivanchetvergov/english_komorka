<body><header class="topbar"><a href="/" class="brand">Lina's <i>homeworks</i></a><nav class="nav" aria-label="Навигация"><a href="/">Главная</a><a href="/about">Обо мне</a><a href="/student">Для ученика</a></nav></header><div class="stripe"></div>

<template id="home-template"><section id="home" class="home"><div class="hero"><div class="hero-copy"><h1>Выполни своё<br><em>домашнее задание.</em></h1><p>Здесь тебя ждут домашние задания, которые я задала тебе. Отвечай внимательно, не торопись и отправляй работу, когда закончишь. Я всегда жду!</p><div class="actions"><a class="secondary" href="/student">Открыть домашнее задание</a></div></div><div class="hero-card"><div><h2>Small steps.<br>Bright minds.</h2><p>Тесты, видео и игровые задания - всё, чтобы учиться было интереснее.</p></div></div></div><div class="section-title"><h2>Как это работает</h2></div><div class="cards"><div class="card"><div class="icon">✦</div><h3>Открой работу</h3><p>Открой ссылку, которую я тебе скинула или введи код домашки.</p></div><div class="card"><div class="icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 14c-5-4-11-5-17-4v25c6-1 12 0 17 4 5-4 11-5 17-4V10c-6-1-12 0-17 4Z"/><path d="M24 14v25M12 17c3 0 6 1 8 3M36 17c-3 0-6 1-8 3"/></svg></div><h3>Выполни задания</h3><p>Отвечай на вопросы, слушай аудио, смотри материалы и проходи игровые задания.</p></div><div class="card"><div class="icon">♡</div><h3>Отправь ответы</h3><p>Проверь ответы и отправь работу. Баллы появятся по личной ссылке после проверки.</p></div></div></section></template>
<template id="about-template"><section id="about" class="workspace"><div class="section-title"><h2>Обо мне</h2></div><div class="about-hero"><div class="about-photo"><img src="/portrait.png" alt="Портрет Лины"></div><div class="about-intro"><h1>Hi, I'm <em>Lina</em></h1><p>Преподаю английский с 2022 года и помогаю разобраться в языке без зубрёжки ради зубрёжки.</p><p>Прокачиваем разговорный английский и разбираемся, как звучат слова. На занятиях много практики, понятных примеров и материалов, которые я делаю сама.</p><p>Если у тебя уже есть ссылка на этот сайт, значит, мы знакомы. А если нет — ниже можно почитать о моём пути в английском и узнать пару фактов обо мне.</p><p>Я тоже постоянно учусь новому, так что отлично понимаю: иногда даже простое слово упорно не хочет запоминаться. Ничего, разберёмся вместе!</p></div></div><div class="section-title"><h2>Пара фактов обо мне</h2></div><div class="cards"><div class="card"><div class="icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11c7-2 12 0 17 4v25c-5-4-10-6-17-4zM41 11c-7-2-12 0-17 4v25c5-4 10-6 17-4z"/><path d="M12 17c3 0 6 1 8 3M36 17c-3 0-6 1-8 3"/></svg></div><h3>Люблю разбирать язык</h3><p>Изучаю компьютерную лингвистику, фонетику и произношение.</p></div><div class="card"><div class="icon">✦</div><h3>Материалы под тебя</h3><p>Подбираю и придумываю материалы под твои темы и интересы.</p></div><div class="card"><div class="icon">♫</div><h3>Мои хобби</h3><p>Делаю музыку, вяжу и учу иностранные языки: китайский, немецкий, арабский, японский, греческий и французский. Английский тоже продолжаю прокачивать.</p></div></div></section></template>
