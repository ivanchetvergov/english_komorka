services:
  homework:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - homework_data:/app/data
volumes:
  homework_data:
